name: f22
on:
  workflow_dispatch: {}
jobs:
  poison:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p a/x b && echo INJECT-$(date +%s) > a/x/marker.txt
      - uses: actions/cache/save@v4
        with:
          key: f22-a-b-cfg
          path: |
            a
            b
  victim-pipe:
    needs: poison
    runs-on: ubuntu-latest
    steps:
      - name: restore with single path "a|b" (version should collide with [a,b])
        uses: actions/cache/restore@v4
        with:
          key: f22-victim-1
          restore-keys: f22-a-
          path: a|b
      - run: find a -name marker.txt | head -2 && cat a/x/marker.txt 2>/dev/null || echo NO-MARKER
  victim-control:
    needs: poison
    runs-on: ubuntu-latest
    steps:
      - name: control path "a:b" (expect MISS)
        uses: actions/cache/restore@v4
        with:
          key: f22-victim-2
          restore-keys: f22-a-
          path: a:b
